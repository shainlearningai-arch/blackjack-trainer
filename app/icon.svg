<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Casino felt background -->
  <rect width="32" height="32" rx="6" fill="#052e16"/>
  <!-- Playing card (white) -->
  <rect x="5" y="3" width="22" height="26" rx="2.5" fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
  <!-- Spade center -->
  <text x="16" y="25" text-anchor="middle" font-size="20" font-family="Georgia, 'Times New Roman', serif" fill="#111111">♠</text>
  <!-- Ace top-left -->
  <text x="9" y="11" text-anchor="middle" font-size="7.5" font-family="Georgia, 'Times New Roman', serif" fill="#111111" font-weight="bold">A</text>
</svg>
